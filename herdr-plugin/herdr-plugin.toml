id = "wayne930242.ccswitch"
name = "ccswitch"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Open the ccswitch dashboard (token expiry, 5-hour and 7-day usage, switching) in an overlay; q or Esc closes it"
platforms = ["macos", "linux"]

# The dashboard runs in a temporary overlay over the active pane; Herdr restores the layout when it exits.
[[panes]]
id = "dashboard"
title = "ccswitch dashboard"
placement = "overlay"
command = ["/bin/bash", "run.sh", "dashboard"]

# Bind this action to a key to open the overlay.
[[actions]]
id = "dashboard"
title = "Open the ccswitch dashboard"
contexts = ["global"]
command = ["/bin/bash", "run.sh", "open"]
